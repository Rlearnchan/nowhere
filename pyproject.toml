[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nowhere"
version = "0.1.0"
description = "Reference hub for market live show preparation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
market = ["yfinance>=0.2"]
dev = ["pytest>=8", "weasyprint>=66", "yfinance>=0.2"]

[project.scripts]
nowhere = "nowhere.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
